[workspace]
members = [
    "crates/data_toolbox_cli",
    "crates/data_toolbox_core",
    "crates/data_toolbox_web",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Tinkora/data_toolbox"

[profile.release]
lto = "thin"
strip = "symbols"
