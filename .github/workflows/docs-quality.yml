name: Documentation quality

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'
      - name: Test documentation checker
        run: ruby scripts/test_check_docs.rb
      - name: Check repository documentation
        run: ruby scripts/check_docs.rb
      - name: Test reusable workflow contracts
        run: ruby scripts/test_check_workflow_contracts.rb
      - name: Check reusable workflow contracts
        run: ruby scripts/check_workflow_contracts.rb
