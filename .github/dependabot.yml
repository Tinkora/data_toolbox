version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      rust-patch-minor:
        update-types: [patch, minor]
  - package-ecosystem: npm
    directory: /crates/data_toolbox_web
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      npm-patch-minor:
        update-types: [patch, minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    groups:
      actions-patch-minor:
        update-types: [patch, minor]
    cooldown:
      default-days: 7
